## Juniper Junos Enterprise Gateway Router
## Device: Juniper-Edge-MX204
##
system {
    host-name Juniper-Edge-MX204;
    root-authentication {
        plain-text-password-value "juniper123";
    }
    services {
        telnet;
        web-management {
            http {
                interface fxp0.0;
            }
        }
        ssh {
            protocol-version v1-only;
        }
    }
    syslog {
        user * {
            any emergency;
        }
        file messages {
            any notice;
        }
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 198.51.100.2/24;
            }
        }
    }
}
snmp {
    community public {
        authorization read-only;
    }
}
