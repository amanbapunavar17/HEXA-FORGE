# Fortinet FortiOS Security Appliance
# Device: FortiGate-Perimeter-FW
#
config system global
    set hostname "FortiGate-Perimeter-FW"
    set admin-sport 80
    set admin-ssh-port 22
end
config system interface
    edit "port1"
        set mode static
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping https ssh http telnet
    next
end
config firewall policy
    edit 1
        set name "PERMIT_ALL_INBOUND"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
