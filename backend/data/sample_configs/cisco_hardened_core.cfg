! Cisco IOS Enterprise Core Router (Hardened Golden Baseline)
! Device: Core-Router-HQ-01
! Standard: CIS Benchmark Compliant & DISA STIG CAT I/II Validated
!
version 17.6
service timestamps debug datetime msec show-timezone
service timestamps log datetime msec show-timezone
service password-encryption
!
hostname Core-Router-HQ-01
!
enable algorithm-type sha256 secret $6$vG8x...$9s8d7f6g5h4j3k2l1
!
aaa new-model
aaa authentication login default group tacacs+ local
!
ip domain name enterprise.gov.in
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
crypto key generate rsa modulus 2048
!
no ip http server
ip http secure-server
!
logging buffered 64000 informational
logging host 10.10.100.50 transport udp port 514
!
ntp server 10.10.1.1 prefer
ntp server 10.10.1.2
ntp authenticate
!
banner login ^C
==================================================================
* WARNING: RESTRICTED CRITICAL INFRASTRUCTURE NETWORK APPLIANCE  *
* UNAUTHORIZED ACCESS IS PROHIBITED BY LAW AND STRICTLY AUDITED  *
==================================================================
^C
!
interface GigabitEthernet0/0/0
 description WAN Gateway to ISP
 ip address 203.0.113.1 255.255.255.0
 ip access-group HARDENED_INGRESS_ACL in
 no shutdown
!
ip access-list extended HARDENED_INGRESS_ACL
 permit tcp 198.51.100.0 0.0.0.255 host 203.0.113.1 eq 443
 permit tcp 198.51.100.0 0.0.0.255 host 203.0.113.1 eq 22
 deny ip any any log
!
line con 0
 exec-timeout 10 0
 transport output none
line vty 0 15
 exec-timeout 10 0
 transport input ssh
 transport output ssh
!
end
