! Cisco IOS Enterprise Core Router Configuration
! Device: Core-Router-HQ-01
! Software: Cisco IOS XE Version 17.06.03
!
version 17.6
service timestamps debug uptime
service timestamps log uptime
no service password-encryption
!
hostname Core-Router-HQ-01
!
boot-start-marker
boot-end-marker
!
enable password cisco
!
no aaa new-model
!
ip domain name corp.internal
!
! INSECURE: SNMP with default community strings
snmp-server community public RO
snmp-server community private RW
!
! INSECURE: HTTP Server enabled without HTTPS
ip http server
no ip http secure-server
!
interface GigabitEthernet0/0/0
 description WAN Gateway Interface to Internet
 ip address 203.0.113.1 255.255.255.0
 ip access-group 101 in
 no shutdown
!
interface GigabitEthernet0/0/1
 description Internal LAN Backbone
 ip address 10.10.10.1 255.255.255.0
 no shutdown
!
! INSECURE: Overly permissive Access List
access-list 101 permit ip any any
!
! INSECURE: Telnet allowed on VTY management lines
line con 0
 password cisco
 login
line vty 0 4
 password cisco
 login
 transport input telnet ssh
line vty 5 15
 password cisco
 login
 transport input telnet
!
end
